# Set your personal hyprland configuration here
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

# Clipboard history manager (cliphist + wofi)
bind = Super, V, exec, pkill -x wofi || ~/.config/hypr/scripts/cliphist.sh c # clipboard: browse & copy
bind = Super+Shift, V, exec, pkill -x wofi || ~/.config/hypr/scripts/cliphist.sh d # clipboard: delete entry
bind = Super+Ctrl, V, exec, ~/.config/hypr/scripts/cliphist.sh w               # clipboard: wipe all
